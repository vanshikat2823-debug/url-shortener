<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>URL Shortener</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>URL Shortener</h1>

    <p>Convert your long URLs into short links.</p>

    <input
            type="url"
            id="originalUrl"
            placeholder="Enter your original URL"
            required
    >

    <button id="shortenButton">
        Shorten URL
    </button>

    <div id="result"></div>

</div>

<script src="script.js"></script>

</body>

</html>
